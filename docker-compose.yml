# FPL Copilot production stack (DigitalOcean droplet).
#
# Replaces the hand-run pair (docker build/run + manual `docker network
# connect fpl-network`) whose attachment nothing recreated -- a container
# restart silently cut the app off from Postgres (observed live 2026-08-31:
# app on the default bridge, fpl-postgres unreachable by name, /health still
# green because it does not touch the DB).
#
# Same container names, same ports, same env var names as the manual setup.
# Compose puts both services on one project network where the service name
# resolves, so DB_HOST=fpl-postgres in ~/fpl-copilot/.env works unchanged and
# survives restarts and reboots with no manual step.
#
# Interpolation (${DB_PASSWORD}, ${DB_NAME}) is read by compose from .env in
# this directory -- the same untracked ~/fpl-copilot/.env the app already
# uses; nothing is duplicated and no secret lives in this file.
#
# One deliberate change from the old setup, because it is the point of the
# migration: restart: unless-stopped (the old containers had restart=no, so a
# droplet reboot left everything down).
#
# Data: NAMED volume fpl_pgdata. The pre-migration anonymous volume
# (0255e948...) is left untouched as a fallback; see Logs/… and the
# 2026-08-31 backup backups/fpl_backup_2026-08-31.dump (sha256 3c9373ad…).

services:
  fpl-postgres:
    image: postgres:16-alpine
    container_name: fpl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-fpl}
    # NO host port. Until 2026-09-11 this published 5432:5432, and a Docker
    # published port BYPASSES ufw (docker-proxy binds 0.0.0.0; the DOCKER-USER
    # chain is empty), so Postgres was reachable from the internet behind
    # scram-sha-256 alone -- the audit connected to it from a laptop. Nothing
    # outside the server needs it: the api and the scheduler reach it over the
    # compose network as DB_HOST=fpl-postgres. Debug access is
    # `docker exec fpl-postgres psql -U postgres -d fpl`.
    volumes:
      - fpl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-fpl}"]
      interval: 5s
      timeout: 3s
      retries: 12

  fpl-copilot:
    build: .
    image: fpl-copilot
    container_name: fpl-copilot
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      fpl-postgres:
        condition: service_healthy
    volumes:
      - fpl_model_data:/app/data

  # The scheduler: SAME image as the app, DIFFERENT job -- it runs one piece
  # of scheduled work and exits, it never serves. Host cron (root, UTC)
  # invokes it as `docker compose run --rm fpl-scheduler ...`; the profile
  # keeps `docker compose up -d` from starting it as a long-lived service.
  # It reuses the image the app service builds (no second build).
  # Three cron jobs use it (root crontab): the availability poller and the
  # deadline dispatcher every 10 min, and since 2026-09-11 the WEEKLY INGEST
  # (eval/run_weekly_ingest.py) every 6 h at :17 -- it holds the dispatcher's
  # lock while it rewrites the volume, and its own gates refuse to start
  # inside a deadline window.
  #
  # /app/.env bind mount: fetch_live_odds / pull_live_props read the KEY by
  # parsing the .env FILE (never printed), so the container must see the
  # LIVE file, not the copy baked in at image build time.
  #
  # fpl_model_data holds data/ -- the ~40MB live subset (see
  # Logs/data_directory_inventory_log.md), not the research artefacts. The
  # app mounts it too: the deadline frame the scheduler writes is what the
  # api will read to run the optimiser on demand (next task).
  fpl-scheduler:
    image: fpl-copilot
    profiles: ["scheduler"]
    env_file: .env
    volumes:
      - fpl_model_data:/app/data
      - ./.env:/app/.env:ro
    command: ["uv", "run", "python", "eval/deadline_dispatcher.py", "--season", "2026-27"]

volumes:
  fpl_pgdata:
  fpl_model_data:
