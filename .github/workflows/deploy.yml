name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd fpl-copilot
            git pull
            # The deploy builds and restarts the APP only. It never touches
            # fpl-postgres: since 2026-09-29 that service has its own build
            # (docker/postgres, pgvector on the pinned base), and a plain
            # `docker compose up -d --build` would rebuild its image and
            # recreate the database container on every push. The database
            # image is built and swapped by hand, in a planned window, with
            # a backup first. `--no-deps` keeps `up` from recreating
            # fpl-postgres when its compose definition differs from the
            # running container (it starts dependencies otherwise).
            # fpl-scheduler needs no build of its own: it runs the fpl-copilot
            # image this step builds (`docker compose run --rm fpl-scheduler`
            # from cron). Both app services share the project network, so the
            # app reaches the DB by service name with NO manual
            # `docker network connect`.
            docker compose build fpl-copilot
            docker compose up -d --no-deps --remove-orphans fpl-copilot
            docker compose ps
