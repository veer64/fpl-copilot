name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd fpl-copilot
            git pull
            # Compose owns the whole stack: builds the app image, keeps
            # fpl-postgres up (named volume fpl_pgdata), and recreates only
            # what changed. Both services share the project network, so the
            # app reaches the DB by service name with NO manual
            # `docker network connect` -- the step the old script depended on
            # implicitly and nothing performed after a restart.
            docker compose up -d --build --remove-orphans
            docker compose ps
