<!DOCTYPE html>
<html>
<head>
    <title>FPL Copilot</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        #chat-box { border: 1px solid #ccc; border-radius: 8px; padding: 20px; min-height: 300px; margin-bottom: 15px; background: #fafafa; overflow-y: auto; max-height: 70vh; }
        .message { margin-bottom: 15px; white-space: pre-wrap; }
        .user { font-weight: bold; }
        .assistant { color: #333; }
        .error { color: #b00020; }
        input { width: 75%; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>⚽ FPL Copilot</h1>
    <button onclick="resetChat()" style="float: right;">New Conversation</button>
    <div id="chat-box"></div>
    <input type="text" id="question" placeholder="Ask about your FPL team..." />
    <button onclick="sendMessage()">Send</button>

    <script>
        // 2026-09-17: this page used to render `data.answer` unconditionally. On any
        // non-200 the body is {"detail": ...} with no `answer`, so the page printed the
        // literal word "undefined" -- which is exactly what happened once the API went
        // behind a key and the browser started getting 401s. Every failure path below
        // now renders something a person can act on. Nothing here may ever produce
        // "undefined".
        const chatBox = document.getElementById("chat-box");

        // textContent, not innerHTML: the answer is arbitrary text and must not be
        // parsed as markup. It also removes the duplicate id="loading" the old code
        // left behind whenever an error stopped it from being removed.
        function addMessage(cls, text) {
            const div = document.createElement("div");
            div.className = "message " + cls;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        // Turn any failed response into one readable sentence. Never returns undefined.
        async function describeFailure(response) {
            let detail = "";
            try {
                const body = await response.json();
                if (typeof body.detail === "string") {
                    detail = body.detail;
                } else if (body.detail !== undefined) {
                    detail = JSON.stringify(body.detail);
                } else {
                    detail = JSON.stringify(body);
                }
            } catch (e) {
                try { detail = (await response.text()).slice(0, 300); } catch (e2) { detail = ""; }
            }
            const tail = detail ? "  [" + detail + "]" : "";
            if (response.status === 401) {
                return "Not signed in (401). Open this page once as  /?key=YOUR_KEY  to set "
                     + "the session cookie for this browser, then try again." + tail;
            }
            if (response.status === 429) {
                return "Rate limited (429) -- too many requests this hour." + tail;
            }
            if (response.status === 503) {
                return "Server not configured (503): APP_API_KEY is not set on the server."
                     + tail;
            }
            if (response.status >= 500) {
                return "The server hit an error (" + response.status + "). Check the "
                     + "container logs; the request did not complete." + tail;
            }
            return "Request failed (" + response.status + " " + response.statusText + ")." + tail;
        }

        async function sendMessage() {
            const input = document.getElementById("question");
            const question = input.value.trim();
            if (!question) return;

            addMessage("user", "You: " + question);
            input.value = "";
            const pending = addMessage("assistant", "Thinking...");

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: question })
                });

                if (!response.ok) {
                    pending.textContent = await describeFailure(response);
                    pending.classList.add("error");
                    return;
                }

                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    pending.textContent = "The server replied with a body that is not JSON.";
                    pending.classList.add("error");
                    return;
                }

                if (typeof data.answer !== "string") {
                    pending.textContent = "The reply carried no `answer` field. Raw body: "
                                        + JSON.stringify(data).slice(0, 300);
                    pending.classList.add("error");
                    return;
                }

                pending.textContent = data.answer;
            } catch (err) {
                // network failure, DNS, the container restarting mid-request
                pending.textContent = "Could not reach the server: " + err;
                pending.classList.add("error");
            }
        }

        async function resetChat() {
            try {
                const response = await fetch("/reset", { method: "POST" });
                if (!response.ok) {
                    // Do NOT clear the box: the server still holds the history, and
                    // clearing it would claim a reset that did not happen.
                    addMessage("assistant error", await describeFailure(response));
                    return;
                }
                chatBox.textContent = "";
            } catch (err) {
                addMessage("assistant error", "Could not reach the server: " + err);
            }
        }

        document.getElementById("question").addEventListener("keydown", function (e) {
            if (e.key === "Enter") { sendMessage(); }
        });
    </script>
</body>
</html>
